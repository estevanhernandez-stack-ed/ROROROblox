49\u0435\u043d\u0438\u044f \u043d\u0430 \u0442\u0435\u043b\u0435\u0444\u043e\u043d \u0447\u0435\u0440\u0435\u0437 Pushover \u0438\u043b\u0438 ntfy \u2014 \u0430\u043b\u044c\u0442 \u0432\u044b\u043b\u0435\u0442\u0435\u043b, \u0438 \u0442\u0435\u043b\u0435\u0444\u043e\u043d \u0437\u0430\u0432\u0438\u0431\u0440\u0438\u0440\u043e\u0432\u0430\u043b, \u0434\u0430\u0436\u0435 \u0431\u0435\u0437 Discord\n\u0421\u0438\u0433\u043d\u0430\u043b \u00ab\u0432\u0441\u0451 \u0432 \u043f\u043e\u0440\u044f\u0434\u043a\u0435\u00bb \u043a\u0430\u0436\u0434\u044b\u0435 \u0434\u0432\u0430 \u0447\u0430\u0441\u0430, \u043f\u043e\u043a\u0430 \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u044b \u0440\u0430\u0431\u043e\u0442\u0430\u044e\u0442, \u2014 \u0442\u0438\u0448\u0438\u043d\u0430 \u0437\u043d\u0430\u0447\u0438\u0442: \u043f\u0440\u043e\u0432\u0435\u0440\u044c\u0442\u0435 \u041f\u041a\n\u041e\u043f\u043e\u0432\u0435\u0449\u0435\u043d\u0438\u044f \u0432\u0435\u0435\u0440\u043e\u043c \u2014 \u0440\u0430\u0431\u043e\u0447\u0438\u0439 \u0441\u0442\u043e\u043b, \u043a\u0430\u043d\u0430\u043b\u044b Discord \u0438 \u0442\u0435\u043b\u0435\u0444\u043e\u043d \u0432 \u043b\u044e\u0431\u043e\u043c \u0441\u043e\u0447\u0435\u0442\u0430\u043d\u0438\u0438, \u043d\u0430 \u043a\u0430\u0436\u0434\u043e\u0435 \u043e\u043f\u043e\u0432\u0435\u0449\u0435\u043d\u0438\u0435\n\u0428\u0435\u0441\u0442\u044c \u044f\u0437\u044b\u043a\u043e\u0432 \u2014 \u0432\u0441\u0451 \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435, \u044d\u043a\u0440\u0430\u043d\u044b \u0438 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f: \u0444\u0440\u0430\u043d\u0446\u0443\u0437\u0441\u043a\u0438\u0439, \u043d\u0435\u043c\u0435\u0446\u043a\u0438\u0439, \u0440\u0443\u0441\u0441\u043a\u0438\u0439, \u043f\u043e\u0440\u0442\u0443\u0433\u0430\u043b\u044c\u0441\u043a\u0438\u0439 (\u0411\u0440\u0430\u0437\u0438\u043b\u0438\u044f), \u043f\u043e\u043b\u044c\u0441\u043a\u0438\u0439, \u0438\u0441\u043f\u0430\u043d\u0441\u043a\u0438\u0439. \u041c\u0433\u043d\u043e\u0432\u0435\u043d\u043d\u043e\u0435 \u043f\u0435\u0440\u0435\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u0435, \u043f\u043e Windows \u0438\u043b\u0438 \u0432\u0430\u0448\u0435\u043c\u0443 \u0432\u044b\u0431\u043e\u0440\u0443", "whatsnew": "v1.27.0.0\n\nRoRoRo \u0433\u043e\u0432\u043e\u0440\u0438\u0442 \u043d\u0430 \u0432\u0430\u0448\u0435\u043c \u044f\u0437\u044b\u043a\u0435\n\u2022 \u0412\u0441\u0451 \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u2014 \u043c\u0435\u043d\u044e, \u043d\u0430\u0441\u0442\u0440\u043e\u0439\u043a\u0438, \u043a\u0430\u0436\u0434\u043e\u0435 \u043e\u043a\u043d\u043e \u0438 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f,\n  \u043a\u043e\u0442\u043e\u0440\u044b\u0435 RoRoRo \u043f\u0438\u0448\u0435\u0442 \u0432\u043e \u0432\u0440\u0435\u043c\u044f \u0440\u0430\u0431\u043e\u0442\u044b, \u2014 \u043f\u0435\u0440\u0435\u0432\u0435\u0434\u0435\u043d\u043e \u043d\u0430\n  \u0444\u0440\u0430\u043d\u0446\u0443\u0437\u0441\u043a\u0438\u0439, \u043d\u0435\u043c\u0435\u0446\u043a\u0438\u0439, \u0440\u0443\u0441\u0441\u043a\u0438\u0439, \u043f\u043e\u0440\u0442\u0443\u0433\u0430\u043b\u044c\u0441\u043a\u0438\u0439 (\u0411\u0440\u0430\u0437\u0438\u043b\u0438\u044f),\n  \u043f\u043e\u043b\u044c\u0441\u043a\u0438\u0439 \u0438 \u0438\u0441\u043f\u0430\u043d\u0441\u043a\u0438\u0439. \u0415\u0441\u043b\u0438 Windows \u043d\u0430\u0441\u0442\u0440\u043e\u0435\u043d\u0430 \u043d\u0430 \u043e\u0434\u0438\u043d \u0438\u0437 \u043d\u0438\u0445,\n  RoRoRo \u043f\u043e\u0434\u0445\u0432\u0430\u0442\u0438\u0442 \u0435\u0433\u043e \u0441\u0430\u043c.\n\n\u041c\u0435\u043d\u044f\u0439\u0442\u0435 \u043a\u043e\u0433\u0434\u0430 \u0443\u0433\u043e\u0434\u043d\u043e, \u043c\u0433\u043d\u043e\u0432\u0435\u043d\u043d\u043e\n\u2022 \u0412 \u0440\u0430\u0437\u0434\u0435\u043b\u0435 \u00ab\u041d\u0430\u0441\u0442\u0440\u043e\u0439\u043a\u0438 > \u0412\u043d\u0435\u0448\u043d\u0438\u0439 \u0432\u0438\u0434\u00bb \u043f\u0435\u0440\u0435\u0447\u0438\u0441\u043b\u0435\u043d\u044b \u0442\u043e\u043b\u044c\u043a\u043e \u0442\u0435\n  \u044f\u0437\u044b\u043a\u0438, \u043d\u0430 \u043a\u043e\u0442\u043e\u0440\u044b\u0435 RoRoRo \u043f\u0435\u0440\u0435\u0432\u0435\u0434\u0451\u043d \u043f\u043e\u043b\u043d\u043e\u0441\u0442\u044c\u044e, \u2014 \u0432\u044b \u043d\u0438\u043a\u043e\u0433\u0434\u0430\n  \u043d\u0435 \u043f\u043e\u043f\u0430\u0434\u0451\u0442\u0435 \u043d\u0430 \u043d\u0430\u043f\u043e\u043b\u043e\u0432\u0438\u043d\u0443 \u043f\u0435\u0440\u0435\u0432\u0435\u0434\u0451\u043d\u043d\u044b\u0439 \u044d\u043a\u0440\u0430\u043d. \u0412\u044b\u0431\u0435\u0440\u0438\u0442\u0435 \u044f\u0437\u044b\u043a,\n  \u0438 \u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u043f\u0435\u0440\u0435\u043a\u043b\u044e\u0447\u0438\u0442\u0441\u044f \u0441\u0440\u0430\u0437\u0443 \u2014 \u0431\u0435\u0437 \u043f\u0435\u0440\u0435\u0437\u0430\u043f\u0443\u0441\u043a\u0430.\n\n\u041f\u043e \u0441\u0443\u0442\u0438 \u0432\u0441\u0451 \u0435\u0449\u0451 \u0430\u043d\u0433\u043b\u0438\u0439\u0441\u043a\u0438\u0439\n\u2022 \u0410\u043d\u0433\u043b\u0438\u0439\u0441\u043a\u0438\u0439 \u043e\u0441\u0442\u0430\u0451\u0442\u0441\u044f \u044f\u0437\u044b\u043a\u043e\u043c \u043f\u043e \u0443\u043c\u043e\u043b\u0447\u0430\u043d\u0438\u044e, \u0430 \u043d\u0430\u0437\u0432\u0430\u043d\u0438\u044f \u0444\u0443\u043d\u043a\u0446\u0438\u0439 \u2014\n  Squad Launch, Recycle, RoRoRo \u2014 \u0447\u0438\u0442\u0430\u044e\u0442\u0441\u044f \u043e\u0434\u0438\u043d\u0430\u043a\u043e\u0432\u043e \u043d\u0430 \u043b\u044e\u0431\u043e\u043c\n  \u044f\u0437\u044b\u043a\u0435. \u0412\u0430\u0448\u0438 \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u044b, \u0442\u0435\u043c\u044b \u0438 \u043d\u0430\u0441\u0442\u0440\u043e\u0439\u043a\u0438 \u043d\u0435 \u043c\u0435\u043d\u044f\u044e\u0442\u0441\u044f.", "captions": "\u0422\u0440\u0438 \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u0430 \u0440\u0430\u0431\u043e\u0442\u0430\u044e\u0442 \u043e\u0434\u043d\u043e\u0432\u0440\u0435\u043c\u0435\u043d\u043d\u043e, \u0443 \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u0441\u0432\u043e\u044f \u043f\u0430\u043c\u044f\u0442\u044c \u0438 \u0441\u0432\u043e\u044f \u043a\u043d\u043e\u043f\u043a\u0430 \u043e\u0441\u0442\u0430\u043d\u043e\u0432\u043a\u0438. \u041a\u0443\u043a\u0438 \u0448\u0438\u0444\u0440\u0443\u044e\u0442\u0441\u044f \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u043e \u0434\u043b\u044f \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u0435\u043b\u044f \u0447\u0435\u0440\u0435\u0437 Windows DPAPI \u0438 \u043d\u0438\u043a\u043e\u0433\u0434\u0430 \u043d\u0435 \u043f\u043e\u043a\u0438\u0434\u0430\u044e\u0442 \u043a\u043e\u043c\u043f\u044c\u044e\u0442\u0435\u0440.\n\u0427\u0435\u0442\u044b\u0440\u0435 \u0432\u0441\u0442\u0440\u043e\u0435\u043d\u043d\u044b\u0435 \u0442\u0435\u043c\u044b. Flatline \u0432\u043e\u043e\u0431\u0449\u0435 \u043d\u0435 \u043f\u0435\u0440\u0435\u0434\u0430\u0451\u0442 \u0441\u043c\u044b\u0441\u043b \u0446\u0432\u0435\u0442\u043e\u043c, \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u043d\u0438\u0447\u0435\u0433\u043e \u043d\u0435 \u0442\u0435\u0440\u044f\u0435\u0442\u0441\u044f \u043f\u0440\u0438 \u0434\u0430\u043b\u044c\u0442\u043e\u043d\u0438\u0437\u043c\u0435, \u043f\u043b\u043e\u0445\u043e\u0439 \u043c\u0430\u0442\u0440\u0438\u0446\u0435 \u0438\u043b\u0438 \u043d\u0430 \u0441\u043e\u043b\u043d\u0446\u0435.\n\u041c\u0443\u043b\u044c\u0442\u0438-\u043b\u0430\u0443\u043d\u0447\u0435\u0440 \u0434\u043b\u044f Windows. \u0423\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0435\u0442 singleton-\u043c\u044c\u044e\u0442\u0435\u043a\u0441 Roblox, \u0447\u0442\u043e\u0431\u044b \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0439 \u043a\u043b\u0438\u0435\u043d\u0442 \u043e\u0442\u043a\u0440\u044b\u0432\u0430\u043b\u0441\u044f, \u0430 \u043d\u0435 \u0431\u043e\u0440\u043e\u043b\u0441\u044f \u0441 \u043f\u0435\u0440\u0432\u044b\u043c. \u0427\u0438\u0441\u0442\u0430\u044f \u0440\u0435\u0430\u043b\u0438\u0437\u0430\u0446\u0438\u044f, \u0430 \u043d\u0435 \u0444\u043e\u0440\u043a.\n\u0421\u043e\u0445\u0440\u0430\u043d\u0438\u0442\u0435 \u0438\u0433\u0440\u044b \u0438 \u043f\u0440\u0438\u0432\u0430\u0442\u043d\u044b\u0435 \u0441\u0435\u0440\u0432\u0435\u0440\u044b, \u0432 \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0442\u0435\u043b\u044c\u043d\u043e \u0438\u0433\u0440\u0430\u0435\u0442\u0435, \u0438 \u0432\u044b\u0431\u0435\u0440\u0438\u0442\u0435 \u0440\u0430\u0437\u043d\u044b\u0435 \u0434\u043b\u044f \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u0430 \u043f\u0435\u0440\u0435\u0434 \u0437\u0430\u043f\u0443\u0441\u043a\u043e\u043c.\n\u0414\u0438\u0430\u0433\u043d\u043e\u0441\u0442\u0438\u043a\u0430 \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442, \u0447\u0442\u043e RoRoRo \u0432\u0438\u0434\u0438\u0442 \u043f\u0440\u044f\u043c\u043e \u0441\u0435\u0439\u0447\u0430\u0441: \u0432\u0435\u0440\u0441\u0438\u0438, \u0441\u043e\u0441\u0442\u043e\u044f\u043d\u0438\u0435 \u0438 \u0433\u0434\u0435 \u043b\u0435\u0436\u0430\u0442 \u043b\u043e\u0433\u0438 \u2014 \u043d\u0430 \u0441\u043b\u0443\u0447\u0430\u0439, \u043a\u043e\u0433\u0434\u0430 \u043d\u0443\u0436\u043d\u043e \u0441\u043e\u043e\u0431\u0449\u0438\u0442\u044c \u043e \u043f\u0440\u043e\u0431\u043b\u0435\u043c\u0435.\n\u041a\u0430\u0436\u0434\u044b\u0439 \u0437\u0430\u043f\u0443\u0441\u043a \u0437\u0430\u043f\u0438\u0441\u044b\u0432\u0430\u0435\u0442\u0441\u044f, \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u0432\u0438\u0434\u043d\u043e, \u043a\u0430\u043a\u043e\u0439 \u0430\u043a\u043a\u0430\u0443\u043d\u0442 \u0432\u043e \u0447\u0442\u043e \u0438\u0433\u0440\u0430\u043b \u0438 \u0441\u043a\u043e\u043b\u044c\u043a\u043e \u0432\u0440\u0435\u043c\u0435\u043d\u0438.\n\u041f\u043b\u0430\u0433\u0438\u043d\u044b \u0440\u0430\u0431\u043e\u0442\u0430\u044e\u0442 \u043e\u0442\u0434\u0435\u043b\u044c\u043d\u044b\u043c\u0438 \u043f\u0440\u043e\u0446\u0435\u0441\u0441\u0430\u043c\u0438 \u0438 \u0441\u043d\u0430\u0447\u0430\u043b\u0430 \u0441\u043f\u0440\u0430\u0448\u0438\u0432\u0430\u044e\u0442. \u0412\u044b \u0432\u044b\u0434\u0430\u0451\u0442\u0435 \u043a\u0430\u0436\u0434\u043e\u0435 \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043d\u0438\u0435 \u043f\u043e \u0438\u043c\u0435\u043d\u0438 \u0438 \u043c\u043e\u0436\u0435\u0442\u0435 \u043e\u0442\u043e\u0437\u0432\u0430\u0442\u044c \u0435\u0433\u043e \u043f\u043e\u0437\u0436\u0435.\n\u0421\u043e\u0431\u0435\u0440\u0438\u0442\u0435 \u0442\u0435\u043c\u0443 \u0438\u0437 \u0434\u0435\u0441\u044f\u0442\u0438 \u0446\u0432\u0435\u0442\u043e\u0432, \u0438 \u043e\u043d\u0430 \u043f\u043e\u044f\u0432\u0438\u0442\u0441\u044f \u0432 \u0441\u043f\u0438\u0441\u043a\u0435. \u042d\u0442\u043e \u0444\u0430\u0439\u043b JSON, \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u0438\u043c \u043c\u043e\u0436\u043d\u043e \u043f\u043e\u0434\u0435\u043b\u0438\u0442\u044c\u0441\u044f.\n\u041a\u043e\u043c\u043f\u0430\u043a\u0442\u043d\u044b\u0439 \u0440\u0435\u0436\u0438\u043c \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u0442\u043e, \u0447\u0442\u043e \u0437\u0430\u043f\u0443\u0449\u0435\u043d\u043e. \u0417\u0430\u043a\u0440\u0435\u043f\u0438\u0442\u0435 \u0435\u0433\u043e \u0432 \u0443\u0433\u043b\u0443 \u044d\u043a\u0440\u0430\u043d\u0430 \u0438 \u0432\u043e\u0437\u0432\u0440\u0430\u0449\u0430\u0439\u0442\u0435\u0441\u044c \u0432 \u0438\u0433\u0440\u0443.\n\u0412\u043e\u0441\u0435\u043c\u044c \u043a\u043b\u0438\u0435\u043d\u0442\u043e\u0432 Roblox, \u0432\u043e\u0441\u0435\u043c\u044c \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u043e\u0432, \u043e\u0434\u0438\u043d \u041f\u041a. \u0412 \u0437\u0430\u0433\u043e\u043b\u043e\u0432\u043a\u0435 \u043a\u0430\u0436\u0434\u043e\u0433\u043e \u043e\u043a\u043d\u0430 \u2014 \u0430\u043a\u043a\u0430\u0443\u043d\u0442, \u043a\u043e\u0442\u043e\u0440\u044b\u0439 \u0432 \u043d\u0451\u043c \u0432\u043e\u0448\u0451\u043b, \u0442\u0430\u043a \u0447\u0442\u043e \u0432\u044b \u0432\u0441\u0435\u0433\u0434\u0430 \u0437\u043d\u0430\u0435\u0442\u0435, \u0433\u0434\u0435 \u043a\u0430\u043a\u043e\u0439.", "keywords": "\u0440\u043e\u0431\u043b\u043e\u043a\u0441\n\u043c\u0443\u043b\u044c\u0442\u0438-\u0430\u043a\u043a\u0430\u0443\u043d\u0442\n\u043b\u0430\u0443\u043d\u0447\u0435\u0440\n\u043c\u0435\u043d\u0435\u0434\u0436\u0435\u0440 \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u043e\u0432\n\u043d\u0435\u0441\u043a\u043e\u043b\u044c\u043a\u043e \u0430\u043a\u043a\u0430\u0443\u043d\u0442\u043e\u0432\n\u0430\u043b\u044c\u0442-\u0430\u043a\u043a\u0430\u0443\u043d\u0442\u044b\nmultibox", "copyright_tm": "\u00a9 2026 626 Labs LLC. \u0412\u0441\u0435 \u043f\u0440\u0430\u0432\u0430 \u0437\u0430\u0449\u0438\u0449\u0435\u043d\u044b. \u00abRoblox\u00bb \u2014 \u0442\u043e\u0432\u0430\u0440\u043d\u044b\u0439 \u0437\u043d\u0430\u043a Roblox Corporation. RoRoRo \u043d\u0435 \u0441\u0432\u044f\u0437\u0430\u043d \u0441 Roblox Corporation, \u043d\u0435 \u043e\u0434\u043e\u0431\u0440\u0435\u043d \u0438 \u043d\u0435 \u0441\u043f\u043e\u043d\u0441\u0438\u0440\u0443\u0435\u0442\u0441\u044f \u0435\u044e.\n\n\u00abRoblox\u00bb \u0438 \u043b\u043e\u0433\u043e\u0442\u0438\u043f Roblox \u2014 \u0442\u043e\u0432\u0430\u0440\u043d\u044b\u0435 \u0437\u043d\u0430\u043a\u0438 Roblox Corporation. RORORO \u2014 \u043d\u0435\u0437\u0430\u0432\u0438\u0441\u0438\u043c\u044b\u0439 \u0441\u0442\u043e\u0440\u043e\u043d\u043d\u0438\u0439 \u0438\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442, \u043d\u0435 \u0441\u0432\u044f\u0437\u0430\u043d\u043d\u044b\u0439 \u0441 Roblox Corporation, \u043d\u0435 \u043e\u0434\u043e\u0431\u0440\u0435\u043d\u043d\u044b\u0439 \u0438 \u043d\u0435 \u0441\u043f\u043e\u043d\u0441\u0438\u0440\u0443\u0435\u043c\u044b\u0439 \u0435\u044e. \u0422\u043e\u0432\u0430\u0440\u043d\u044b\u0439 \u0437\u043d\u0430\u043a \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u0443\u0435\u0442\u0441\u044f \u0438\u0441\u043a\u043b\u044e\u0447\u0438\u0442\u0435\u043b\u044c\u043d\u043e \u0434\u043b\u044f \u043e\u043f\u0438\u0441\u0430\u043d\u0438\u044f \u0441\u043e\u0432\u043c\u0435\u0441\u0442\u0438\u043c\u043e\u0441\u0442\u0438 \u0441 \u043f\u043b\u0430\u0442\u0444\u043e\u0440\u043c\u043e\u0439 Roblox. RORORO \u0437\u0430\u043f\u0443\u0441\u043a\u0430\u0435\u0442 \u043e\u0444\u0438\u0446\u0438\u0430\u043b\u044c\u043d\u044b\u0439 \u043a\u043b\u0438\u0435\u043d\u0442 Roblox \u0431\u0435\u0437 \u0438\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u0439.", "license": "RORORO source code is licensed under the MIT License. Full text: https://github.com/estevanhernandez-stack-ed/ROROROblox/blob/main/LICENSE\n\nRORORO is provided \"as is,\" without warranty of any kind. Use of RORORO to access the Roblox platform is governed by Roblox Corporation's own Terms of Use, which you must accept separately when you sign in to a Roblox account. Roblox Corporation has stated that multi-instancing tools \"may be considered malicious behaviour\"; while RORORO does not modify the Roblox client and only holds a Windows named-mutex before launch, the user accepts any risk of Roblox-side enforcement on their accounts.\n\nNo warranty is offered or implied for compatibility with future versions of the Roblox client. The bundled remote-config update mechanism is best-effort.", "developedby": "626 Labs LLC"}, "pt-br": {"productname": "RoRoRo \u2014 Multi-launcher para Windows", "short": "Multi-launcher para Windows em 6 idiomas: v\u00e1rios clientes Roblox lado a lado, cada um na sua conta. Cofre criptografado, Squad Launch, vigia de mem\u00f3ria, alertas no celular, status ao vivo, temas.", "long": "Multi-launcher para Windows.\n\nO RoRoRo \u00e9 um launcher para Windows que roda v\u00e1rios clientes Roblox ao mesmo tempo no mesmo PC, cada um conectado a uma conta salva diferente que pertence a voc\u00ea. Adicione suas contas uma vez pela pr\u00f3pria p\u00e1gina de login do Roblox e depois inicie qualquer uma com um clique \u2014 no jogo padr\u00e3o, num servidor privado salvo ou em qualquer link de jogo colado.\n\nO que voc\u00ea leva:\n\u2022 Multi-inst\u00e2ncia com um clique. O RoRoRo segura o mutex singleton do Roblox, ent\u00e3o clientes adicionais abrem em vez de trazer o primeiro para a frente.\n\u2022 Cofre de contas criptografado (DPAPI). Os cookies salvos s\u00e3o criptografados com a API de Prote\u00e7\u00e3o de Dados do Windows, presos \u00e0 sua conta do Windows \u2014 um arquivo copiado para outro PC n\u00e3o descriptografa. Mover contas entre os seus pr\u00f3prios PCs \u00e9 um export deliberado, protegido por frase-senha.\n\u2022 Status ao vivo de cada conta. Veja qual conta est\u00e1 em qual jogo, quem est\u00e1 parado e h\u00e1 quanto tempo, com limite de FPS por conta que n\u00e3o se perde.\n\u2022 Squad Launch + Friend Follow. Mande todas as contas selecionadas para o mesmo servidor privado, siga um amigo at\u00e9 o dele, ou junte suas contas num servidor p\u00fablico.\n\u2022 Vigia de mem\u00f3ria + Recycle. O RoRoRo aprende quanto um cliente Roblox realmente custa de RAM na sua m\u00e1quina e avisa antes de acabar. Um clique fecha um cliente pesado e o devolve ao mesmo servidor em que estava.\n\u2022 Uma s\u00f3 janela de ferramentas. Jogos, configura\u00e7\u00f5es, hist\u00f3rico, diagn\u00f3stico, plugins e Sobre s\u00e3o p\u00e1ginas de uma \u00fanica janela ao lado das contas \u2014 com atalhos de teclado em tudo; F1 mostra a lista.\n\u2022 Temas. Quatro embutidos, incluindo um que nunca depende s\u00f3 de cor, mais um editor para criar o seu a partir de dez cores e compartilhar como arquivo.\n\u2022 Alertas opcionais \u2014 desktop, Discord ou celular. Direcione cada alerta para qualquer combina\u00e7\u00e3o: notifica\u00e7\u00f5es no desktop, um webhook do Discord que voc\u00ea cria, ou seu celular via Pushover ou ntfy. Quedas de conta, avisos de mem\u00f3ria, conclus\u00f5es de Recycle e um sinal de \"tudo certo\" a cada duas horas. Uma instala\u00e7\u00e3o nova n\u00e3o faz nenhuma chamada de alerta \u2014 nada sai antes de voc\u00ea configurar.\n\u2022 Bandeja do sistema com \u00edcone colorido por estado \u2014 o status de multi-inst\u00e2ncia \u00e0 primeira vista; clique duplo inicia sua conta principal.\n\u2022 Sistema de plugins. Plugins opcionais rodam como processos separados e n\u00e3o t\u00eam permiss\u00e3o nenhuma at\u00e9 voc\u00ea conceder uma a uma.\n\u2022 Atualiza\u00e7\u00e3o autom\u00e1tica via Velopack. Uma configura\u00e7\u00e3o remota acompanha a vers\u00e3o do Roblox e o nome do mutex conhecidos, para uma mudan\u00e7a do lado do Roblox n\u00e3o te travar por muito tempo.\n\u2022 Acessibilidade medida. Cada controle anuncia seu nome para tecnologias assistivas, e o contraste \u00e9 verificado nos pixels renderizados em todos os temas.\n\u2022 Fala o seu idioma. O app inteiro \u2014 cada menu, configura\u00e7\u00e3o, dica e janela, e as mensagens que o RoRoRo escreve enquanto voc\u00ea usa \u2014 \u00e9 traduzido para franc\u00eas, alem\u00e3o, russo, portugu\u00eas (Brasil), polon\u00eas e espanhol, seguindo o idioma do seu Windows ou sua escolha nas Configura\u00e7\u00f5es. A troca \u00e9 imediata, e a lista s\u00f3 oferece idiomas totalmente traduzidos, para voc\u00ea nunca cair numa tela pela metade em ingl\u00eas.\n\nPrivacidade e seguran\u00e7a:\nSua senha do Roblox nunca \u00e9 vista pelo RoRoRo. O login acontece inteiramente na p\u00e1gina do pr\u00f3prio Roblox, embutida num quadro Microsoft Edge WebView2 \u2014 mesmo HTML, mesma conex\u00e3o HTTPS do seu navegador. O RoRoRo captura apenas o cookie de sess\u00e3o que o Roblox define ap\u00f3s o login, e o criptografa antes de gravar em disco. Sem telemetria. Sem analytics. Nada sai da sua m\u00e1quina al\u00e9m das chamadas ao Roblox durante o lan\u00e7amento \u2014 as mesmas que o Roblox.com faz do seu navegador \u2014 e, somente se voc\u00ea mesmo configurar, alertas para o seu webhook do Discord ou o servi\u00e7o de push escolhido (Pushover ou ntfy).\n\nImportante: aviso de marcas e afilia\u00e7\u00e3o.\n\"Roblox\" e o logotipo Roblox s\u00e3o marcas da Roblox Corporation. O RoRoRo \u00e9 uma ferramenta independente de terceiros, n\u00e3o afiliada, endossada ou patrocinada pela Roblox Corporation. O termo \u00e9 usado apenas para descrever compatibilidade com a plataforma Roblox. O RoRoRo inicia o cliente oficial do Roblox sem modific\u00e1-lo \u2014 sem inje\u00e7\u00e3o, sem hooks, sem alterar o processo do Roblox; ele apenas segura um mutex nomeado do Windows antes do lan\u00e7amento, para que as inst\u00e2ncias seguintes do cliente vejam a checagem de singleton como j\u00e1 ocupada.\n\nUm produto 626 Labs.", "features": "Launcher multi-inst\u00e2ncia para Roblox no Windows, com um clique\nCofre de contas criptografado com DPAPI e export protegido por frase-senha\nStatus ao vivo por conta \u2014 em qual jogo est\u00e1, tempo parado e limite de FPS por conta\nVigia de mem\u00f3ria que aprende o custo real de RAM de cada cliente, mais Recycle de um clique ao mesmo servidor\nSquad Launch e Friend Follow \u2014 mesmo servidor privado, ou um servidor p\u00fablico juntos\nEntrar por link de qualquer URL roblox.com, com servidores privados salvos por conta\nUma janela de ferramentas para Jogos, Configura\u00e7\u00f5es, Hist\u00f3rico e mais, com atalhos de teclado\nQuatro temas embutidos mais um editor para criar o seu\nAlertas opcionais do Discord para um webhook que voc\u00ea cria\nBandeja do sistema com \u00edcone colorido por estado e clique duplo para a conta principal\nSistema de plugins com consentimento por capacidade e isolamento fora do processo\nAtualiza\u00e7\u00e3o autom\u00e1tica que continua funcionando quando o Roblox muda por baixo\nIniciar com o Windows se quiser \u2014 um bot\u00e3o s\u00f3, e a lista de Inicializa\u00e7\u00e3o do Windows continua no comando\nDiscord Join abre o RoRoRo mesmo fechado, e sempre pergunta antes de iniciar qualquer coisa\nAlertas no celular via Pushover ou ntfy \u2014 um alt cai e seu celular vibra, mesmo com o Discord fechado\nSinais de \"tudo certo\" a cada duas horas enquanto as contas rodam \u2014 sil\u00eancio significa problema\nAlertas em leque \u2014 desktop, canais do Discord e celular em qualquer combina\u00e7\u00e3o, por alerta\nDispon\u00edvel em seis idiomas \u2014 o app inteiro, telas e mensagens, em franc\u00eas, alem\u00e3o, russo, portugu\u00eas (Brasil), polon\u00eas ou espanhol, troca imediata, seguindo o Windows ou sua escolha", "whatsnew": "v1.27.0.0\n\nO RoRoRo fala o seu idioma\n\u2022 O app inteiro \u2014 menus, configura\u00e7\u00f5es, cada janela e as\n  mensagens que o RoRoRo escreve enquanto voc\u00ea usa \u2014 est\u00e1\n  traduzido para franc\u00eas, alem\u00e3o, russo, portugu\u00eas (Brasil),\n  polon\u00eas e espanhol. Se o Windows estiver em um desses, o\n  RoRoRo adota sozinho.\n\nTroque quando quiser, na hora\n\u2022 Configura\u00e7\u00f5es > Apar\u00eancia lista s\u00f3 os idiomas para os quais\n  o RoRoRo est\u00e1 totalmente traduzido \u2014 voc\u00ea nunca cai numa\n  tela pela metade. Escolha um e o app muda na hora, sem\n  reiniciar.\n\nAinda ingl\u00eas no fundo\n\u2022 O ingl\u00eas continua sendo o padr\u00e3o, e os nomes de recursos \u2014\n  Squad Launch, Recycle, RoRoRo \u2014 se leem igual em qualquer\n  idioma. Nada muda nas suas contas, temas ou configura\u00e7\u00f5es.", "captions": "Tr\u00eas contas rodando ao mesmo tempo, cada uma com seu pr\u00f3prio uso de mem\u00f3ria e seu pr\u00f3prio bot\u00e3o de parada. Os cookies s\u00e3o criptografados por usu\u00e1rio com o Windows DPAPI e nunca saem da m\u00e1quina.\nQuatro temas nativos. O Flatline n\u00e3o transmite nenhum significado pela cor, ent\u00e3o nada se perde com daltonismo, um monitor ruim ou sol direto.\nMulti-launcher para Windows. Segura o mutex singleton do Roblox para que o pr\u00f3ximo cliente abra em vez de brigar com o primeiro. Uma reimplementa\u00e7\u00e3o limpa, n\u00e3o um fork.\nSalve os jogos e servidores privados que voc\u00ea realmente joga e escolha um diferente para cada conta antes de iniciar.\nO Diagn\u00f3stico mostra o que o RoRoRo enxerga agora: vers\u00f5es, sa\u00fade e onde ficam os logs, para quando voc\u00ea precisar relatar algo.\nCada inicializa\u00e7\u00e3o fica registrada, ent\u00e3o voc\u00ea v\u00ea qual conta jogou o qu\u00ea e por quanto tempo.\nOs plugins rodam como processos separados e perguntam antes. Voc\u00ea concede cada permiss\u00e3o pelo nome e pode revog\u00e1-la depois.\nMonte um tema com dez cores e ele aparece no seletor. \u00c9 um arquivo JSON, ent\u00e3o d\u00e1 para passar para outra pessoa.\nO modo compacto mostra s\u00f3 o que est\u00e1 rodando. Fixe num canto da tela e volte para o jogo.\nOito clientes Roblox, oito contas, um PC. O t\u00edtulo de cada janela carrega a conta conectada nela, ent\u00e3o voc\u00ea sempre sabe qual \u00e9 qual.", "keywords": "roblox\nmulti inst\u00e2ncia\nmulti-conta\nlauncher\ngerenciador de contas\ncontas alt\nmultibox", "copyright_tm": "\u00a9 2026 626 Labs LLC. Todos os direitos reservados. \"Roblox\" \u00e9 uma marca da Roblox Corporation. O RoRoRo n\u00e3o \u00e9 afiliado, endossado ou patrocinado pela Roblox Corporation.\n\n\"Roblox\" e o logotipo Roblox s\u00e3o marcas da Roblox Corporation. O RORORO \u00e9 uma ferramenta independente de terceiros, n\u00e3o afiliada, endossada ou patrocinada pela Roblox Corporation. O termo \u00e9 usado apenas para descrever compatibilidade com a plataforma Roblox. O RORORO inicia o cliente oficial do Roblox sem modifica\u00e7\u00f5es.", "license": "RORORO source code is licensed under the MIT License. Full text: https://github.com/estevanhernandez-stack-ed/ROROROblox/blob/main/LICENSE\n\nRORORO is provided \"as is,\" without warranty of any kind. Use of RORORO to access the Roblox platform is governed by Roblox Corporation's own Terms of Use, which you must accept separately when you sign in to a Roblox account. Roblox Corporation has stated that multi-instancing tools \"may be considered malicious behaviour\"; while RORORO does not modify the Roblox client and only holds a Windows named-mutex before launch, the user accepts any risk of Roblox-side enforcement on their accounts.\n\nNo warranty is offered or implied for compatibility with future versions of the Roblox client. The bundled remote-config update mechanism is best-effort.", "developedby": "626 Labs LLC"}, "pl": {"productname": "RoRoRo \u2014 Multi-launcher na Windowsa", "short": "Multi-launcher dla Windows, teraz w 6 j\u0119zykach: kilka klient\u00f3w Roblox obok siebie, ka\u017cdy na innym koncie. Szyfrowany sejf, Squad Launch, stra\u017cnik pami\u0119ci, alerty na telefon, status na \u017cywo, motywy.", "long": "Multi-launcher dla Windows.\n\nRoRoRo to launcher dla Windows, kt\u00f3ry uruchamia kilka klient\u00f3w Roblox jednocze\u015bnie na jednym PC \u2014 ka\u017cdy zalogowany na inne zapisane konto, kt\u00f3re nale\u017cy do ciebie. Dodaj konta raz przez w\u0142asn\u0105 stron\u0119 logowania Roblox, a potem uruchamiaj je jednym klikni\u0119ciem \u2014 do domy\u015blnej gry, na zapisany prywatny serwer albo z dowolnego wklejonego linku do gry.\n\nCo dostajesz:\n\u2022 Multi-instancja jednym klikni\u0119ciem. RoRoRo trzyma mutex singleton Roblox, wi\u0119c kolejne klienty si\u0119 otwieraj\u0105, zamiast wyci\u0105ga\u0107 pierwszy na wierzch.\n\u2022 Szyfrowany sejf kont (DPAPI). Zapisane pliki cookie s\u0105 szyfrowane interfejsem Windows Data Protection API i zwi\u0105zane z twoim kontem Windows \u2014 plik skopiowany na inny PC si\u0119 nie odszyfruje. Przenoszenie kont mi\u0119dzy w\u0142asnymi komputerami to \u015bwiadomy eksport chroniony fraz\u0105-has\u0142em.\n\u2022 Status ka\u017cdego konta na \u017cywo. Widzisz, kt\u00f3re konto jest w kt\u00f3rej grze, kto stoi bezczynnie i jak d\u0142ugo, a limit FPS ustawiasz osobno dla ka\u017cdego konta \u2014 i on si\u0119 trzyma.\n\u2022 Squad Launch + Friend Follow. Wy\u015blij wszystkie zaznaczone konta na ten sam prywatny serwer, do\u0142\u0105cz za znajomym na jego serwer albo wyl\u0105duj kontami razem na jednym publicznym.\n\u2022 Stra\u017cnik pami\u0119ci + Recycle. RoRoRo uczy si\u0119, ile RAM-u klient Roblox naprawd\u0119 kosztuje na twojej maszynie, i ostrzega, zanim jej zabraknie. Jedno klikni\u0119cie zamyka ci\u0119\u017ckiego klienta i odsy\u0142a go na ten sam serwer.\n\u2022 Jedno okno narz\u0119dzi. Gry, ustawienia, historia, diagnostyka, pluginy i O programie to strony jednego okna obok listy kont \u2014 ze skr\u00f3tami klawiszowymi wsz\u0119dzie; F1 pokazuje list\u0119.\n\u2022 Motywy. Cztery wbudowane, w tym jeden, kt\u00f3ry nigdy nie przekazuje znaczenia samym kolorem, plus edytor w\u0142asnych motyw\u00f3w z dziesi\u0119ciu kolor\u00f3w, z udost\u0119pnianiem w pliku.\n\u2022 Alerty opcjonalne \u2014 pulpit, Discord albo telefon. Skieruj ka\u017cdy alert w dowoln\u0105 kombinacj\u0119: powiadomienia na pulpicie, utworzony przez ciebie webhook Discorda albo telefon przez Pushover lub ntfy. Wylogowania alt\u00f3w, ostrze\u017cenia o pami\u0119ci, zako\u0144czenia Recycle i sygna\u0142 \u201ewszystko gra\" co dwie godziny. \u015awie\u017ca instalacja nie wykonuje \u017cadnych wywo\u0142a\u0144 alert\u00f3w \u2014 nic nie wychodzi, dop\u00f3ki sam czego\u015b nie skonfigurujesz.\n\u2022 Zasobnik systemowy. Ikona w kolorze stanu rzutem oka pokazuje stan multi-instancji; dwuklik uruchamia g\u0142\u00f3wne konto.\n\u2022 System plugin\u00f3w. Opcjonalne pluginy dzia\u0142aj\u0105 jako osobne procesy i nie maj\u0105 \u017cadnych uprawnie\u0144, dop\u00f3ki nie nadasz ka\u017cdemu z osobna.\n\u2022 Automatyczne aktualizacje przez Velopack. Zdalna konfiguracja \u015bledzi znan\u0105 wersj\u0119 Roblox i nazw\u0119 mutexa, \u017ceby zmiana po stronie Roblox nie blokowa\u0142a ci\u0119 na d\u0142ugo.\n\u2022 Dost\u0119pno\u015b\u0107 mierzona. Ka\u017cda kontrolka przedstawia si\u0119 technologiom asystuj\u0105cym, a kontrast jest sprawdzany na wyrenderowanych pikselach w ka\u017cdym motywie.\n\u2022 M\u00f3wi w twoim j\u0119zyku. Ca\u0142a aplikacja \u2014 ka\u017cde menu, ustawienie, podpowied\u017a i okno, a tak\u017ce komunikaty, kt\u00f3re RoRoRo wypisuje podczas pracy \u2014 jest przet\u0142umaczona na francuski, niemiecki, rosyjski, portugalski (brazylijski), polski i hiszpa\u0144ski, zgodnie z j\u0119zykiem Windows lub twoim wyborem w Ustawieniach. Zmiana dzia\u0142a natychmiast, a lista pokazuje tylko w pe\u0142ni przet\u0142umaczone j\u0119zyki, wi\u0119c nigdy nie trafisz na ekran w po\u0142owie po angielsku.\n\nPrywatno\u015b\u0107 i bezpiecze\u0144stwo:\nRoRoRo nigdy nie widzi twojego has\u0142a do Roblox. Logowanie odbywa si\u0119 w ca\u0142o\u015bci na stronie samego Roblox, osadzonej w ramce Microsoft Edge WebView2 \u2014 ten sam HTML, to samo po\u0142\u0105czenie HTTPS co w przegl\u0105darce. RoRoRo przechwytuje tylko cookie sesji, kt\u00f3re Roblox ustawia po zalogowaniu, i szyfruje je przed zapisem na dysk. Zero telemetrii. Zero analityki. Nic nie opuszcza twojej maszyny poza wywo\u0142aniami do Roblox przy starcie \u2014 tymi samymi, kt\u00f3re Roblox.com robi z przegl\u0105darki \u2014 oraz, wy\u0142\u0105cznie je\u015bli sam je skonfigurujesz, alertami na tw\u00f3j webhook Discorda albo wybran\u0105 us\u0142ug\u0119 push (Pushover lub ntfy).\n\nWa\u017cne: znaki towarowe i powi\u0105zania.\n\u201eRoblox\" i logo Roblox s\u0105 znakami towarowymi Roblox Corporation. RoRoRo to niezale\u017cne narz\u0119dzie zewn\u0119trzne, niepowi\u0105zane z Roblox Corporation, nierekomendowane ani niesponsorowane przez ni\u0105. Znak towarowy s\u0142u\u017cy wy\u0142\u0105cznie opisaniu zgodno\u015bci z platform\u0105 Roblox. RoRoRo uruchamia oficjalnego klienta Roblox bez modyfikacji \u2014 bez wstrzykiwania, bez hook\u00f3w, bez ingerencji w proces Roblox; przed startem jedynie trzyma nazwany mutex Windows, tak aby kolejne instancje klienta widzia\u0142y sprawdzenie singletona jako ju\u017c zaj\u0119te.\n\nProdukt 626 Labs.", "features": "Launcher multi-instancji dla Roblox na Windows \u2014 jednym klikni\u0119ciem\nSzyfrowany sejf kont DPAPI z eksportem chronionym fraz\u0105-has\u0142em\nStatus ka\u017cdego konta na \u017cywo \u2014 gra, czas bezczynno\u015bci i limit FPS na konto\nStra\u017cnik pami\u0119ci ucz\u0105cy si\u0119 prawdziwego kosztu RAM ka\u017cdego klienta, plus Recycle jednym klikni\u0119ciem na ten sam serwer\nSquad Launch i Friend Follow \u2014 ten sam prywatny serwer albo wsp\u00f3lny publiczny\nDo\u0142\u0105czanie z linku z dowolnego URL roblox.com, z zapisanymi prywatnymi serwerami na konto\nJedno okno narz\u0119dzi: gry, ustawienia, historia i wi\u0119cej, ze skr\u00f3tami klawiszowymi\nCztery wbudowane motywy plus edytor w\u0142asnych\nOpcjonalne alerty Discord na utworzony przez ciebie webhook\nZasobnik z ikon\u0105 w kolorze stanu i dwuklikiem uruchamiaj\u0105cym g\u0142\u00f3wne konto\nSystem plugin\u00f3w ze zgod\u0105 na ka\u017cd\u0105 zdolno\u015b\u0107 i izolacj\u0105 w osobnych procesach\nAutomatyczne aktualizacje odporne na zmiany po stronie Roblox\nStart z Windows, je\u015bli chcesz \u2014 jeden prze\u0142\u0105cznik, a lista Autostartu Windows ma ostatnie s\u0142owo\nDiscord Join uruchamia RoRoRo nawet zamkni\u0119te \u2014 i zawsze pyta, zanim cokolwiek wystartuje\nAlerty na telefon przez Pushover lub ntfy \u2014 alt wypada i telefon wibruje, nawet bez Discorda\nSygna\u0142 \u201ewszystko gra\" co dwie godziny, p\u00f3ki konta dzia\u0142aj\u0105 \u2014 cisza znaczy: sprawd\u017a PC\nAlerty wachlarzem \u2014 pulpit, kana\u0142y Discord i telefon w dowolnej kombinacji, na ka\u017cdy alert\nSze\u015b\u0107 j\u0119zyk\u00f3w \u2014 ca\u0142a aplikacja, ekrany i komunikaty: francuski, niemiecki, rosyjski, portugalski (brazylijski), polski, hiszpa\u0144ski. Natychmiastowa zmiana, wg Windows lub twojego wyboru", "whatsnew": "v1.27.0.0\n\nRoRoRo m\u00f3wi w Twoim j\u0119zyku\n\u2022 Ca\u0142a aplikacja \u2014 menu, ustawienia, ka\u017cde okno i komunikaty,\n  kt\u00f3re RoRoRo wypisuje podczas pracy \u2014 jest przet\u0142umaczona na\n  francuski, niemiecki, rosyjski, portugalski (Brazylia),\n  polski i hiszpa\u0144ski. Je\u015bli Windows jest ustawiony na jeden z\n  nich, RoRoRo sam go podchwyci.\n\nZmieniaj kiedy chcesz, natychmiast\n\u2022 Ustawienia > Wygl\u0105d pokazuj\u0105 tylko j\u0119zyki, na kt\u00f3re RoRoRo\n  jest w pe\u0142ni przet\u0142umaczone \u2014 nigdy nie trafisz na ekran\n  przet\u0142umaczony w po\u0142owie. Wybierz j\u0119zyk, a aplikacja\n  prze\u0142\u0105czy si\u0119 od razu, bez restartu.\n\nW \u015brodku nadal angielski\n\u2022 Angielski pozostaje domy\u015blny, a nazwy funkcji \u2014 Squad\n  Launch, Recycle, RoRoRo \u2014 czyta si\u0119 tak samo w ka\u017cdym\n  j\u0119zyku. Twoje konta, motywy i ustawienia si\u0119 nie zmieniaj\u0105.", "captions": "Trzy konta dzia\u0142aj\u0105 naraz, ka\u017cde z w\u0142asnym zu\u017cyciem pami\u0119ci i w\u0142asnym przyciskiem zatrzymania. Ciasteczka szyfruje Windows DPAPI osobno dla ka\u017cdego u\u017cytkownika i nigdy nie opuszczaj\u0105 komputera.\nCztery wbudowane motywy. Flatline w og\u00f3le nie przekazuje znaczenia kolorem, wi\u0119c nic nie ginie przy daltonizmie, s\u0142abej matrycy ani w pe\u0142nym s\u0142o\u0144cu.\nMulti-launcher na Windowsa. Trzyma mutex singletona Roblox, \u017ceby kolejny klient si\u0119 otwiera\u0142, zamiast walczy\u0107 z pierwszym. Czysta reimplementacja, nie fork.\nZapisz gry i prywatne serwery, w kt\u00f3re naprawd\u0119 grasz, a przed startem wybierz inne dla ka\u017cdego konta.\nDiagnostyka pokazuje, co RoRoRo widzi w tej chwili: wersje, stan i miejsce log\u00f3w \u2014 na wypadek, gdy trzeba co\u015b zg\u0142osi\u0107.\nKa\u017cde uruchomienie jest zapisywane, wi\u0119c widzisz, kt\u00f3re konto w co gra\u0142o i jak d\u0142ugo.\nWtyczki dzia\u0142aj\u0105 jako osobne procesy i najpierw pytaj\u0105. Ka\u017cde uprawnienie przyznajesz z nazwy i mo\u017cesz je p\u00f3\u017aniej cofn\u0105\u0107.\nZbuduj motyw z dziesi\u0119ciu kolor\u00f3w, a pojawi si\u0119 na li\u015bcie. To plik JSON, wi\u0119c mo\u017cesz go komu\u015b przekaza\u0107.\nTryb kompaktowy pokazuje tylko to, co dzia\u0142a. Przypnij go w rogu ekranu i wracaj do gry.\nOsiem klient\u00f3w Roblox, osiem kont, jeden PC. Tytu\u0142 ka\u017cdego okna niesie konto, kt\u00f3re jest w nim zalogowane, wi\u0119c zawsze wiesz, kt\u00f3re jest kt\u00f3re.", "keywords": "roblox\nwiele instancji\nmultikonto\nlauncher\nmened\u017cer kont\nkonta alt\nmultibox", "copyright_tm": "\u00a9 2026 626 Labs LLC. Wszelkie prawa zastrze\u017cone. \u201eRoblox\" jest znakiem towarowym Roblox Corporation. RoRoRo nie jest powi\u0105zane z Roblox Corporation, rekomendowane ani sponsorowane przez ni\u0105.\n\n\u201eRoblox\" i logo Roblox s\u0105 znakami towarowymi Roblox Corporation. RORORO to niezale\u017cne narz\u0119dzie zewn\u0119trzne, niepowi\u0105zane z Roblox Corporation, nierekomendowane ani niesponsorowane przez ni\u0105. Znak towarowy s\u0142u\u017cy wy\u0142\u0105cznie opisaniu zgodno\u015bci z platform\u0105 Roblox. RORORO uruchamia oficjalnego klienta Roblox bez modyfikacji.", "license": "RORORO source code is licensed under the MIT License. Full text: https://github.com/estevanhernandez-stack-ed/ROROROblox/blob/main/LICENSE\n\nRORORO is provided \"as is,\" without warranty of any kind. Use of RORORO to access the Roblox platform is governed by Roblox Corporation's own Terms of Use, which you must accept separately when you sign in to a Roblox account. Roblox Corporation has stated that multi-instancing tools \"may be considered malicious behaviour\"; while RORORO does not modify the Roblox client and only holds a Windows named-mutex before launch, the user accepts any risk of Roblox-side enforcement on their accounts.\n\nNo warranty is offered or implied for compatibility with future versions of the Roblox client. The bundled remote-config update mechanism is best-effort.", "developedby": "626 Labs LLC"}, "es": {"productname": "RoRoRo \u2014 Multi-launcher para Windows", "short": "Multi-launcher para Windows en 6 idiomas: varios clientes de Roblox a la vez, cada uno con su cuenta. Ba\u00fal cifrado, Squad Launch, vigilante de memoria, alertas al m\u00f3vil, estado en vivo y temas.", "long": "Multi-launcher para Windows.\n\nRoRoRo es un launcher para Windows que ejecuta varios clientes de Roblox a la vez en un mismo PC, cada uno con una cuenta guardada distinta que te pertenece. A\u00f1ade tus cuentas una sola vez desde la propia p\u00e1gina de inicio de sesi\u00f3n de Roblox y luego l\u00e1nzalas con un clic: a su juego predeterminado, a un servidor privado guardado o a cualquier enlace de juego que pegues.\n\nLo que obtienes:\n\u2022 Multi-instancia con un clic. RoRoRo retiene el mutex singleton de Roblox, as\u00ed que los clientes adicionales se abren en lugar de traer el primero al frente.\n\u2022 Ba\u00fal de cuentas cifrado (DPAPI). Las cookies guardadas se cifran con la API de Protecci\u00f3n de Datos de Windows, ligadas a tu cuenta de Windows: un archivo copiado a otro PC no se descifra. Mover cuentas entre tus propios equipos es una exportaci\u00f3n deliberada, protegida con frase de contrase\u00f1a.\n\u2022 Estado en vivo de cada cuenta. Ve qu\u00e9 cuenta est\u00e1 en qu\u00e9 juego, qui\u00e9n lleva cu\u00e1nto tiempo inactivo, y fija l\u00edmites de FPS por cuenta que se mantienen.\n\u2022 Squad Launch + Friend Follow. Manda todas las cuentas seleccionadas al mismo servidor privado, sigue a un amigo hasta el suyo o junta tus cuentas en un servidor p\u00fablico.\n\u2022 Vigilante de memoria + Recycle. RoRoRo aprende cu\u00e1nta RAM cuesta de verdad un cliente de Roblox en tu m\u00e1quina y avisa antes de que se agote. Un clic cierra un cliente pesado y lo devuelve al mismo servidor donde estaba.\n\u2022 Una sola ventana de herramientas. Juegos, ajustes, historial, diagn\u00f3stico, plugins y Acerca de son p\u00e1ginas de una misma ventana junto a tus cuentas, con atajos de teclado en todas partes \u2014 F1 muestra la lista.\n\u2022 Temas. Cuatro integrados, incluido uno que nunca transmite significado solo con color, m\u00e1s un editor para crear el tuyo a partir de diez colores y compartirlo como archivo.\n\u2022 Alertas opcionales: escritorio, Discord o m\u00f3vil. Dirige cada alerta a cualquier combinaci\u00f3n: notificaciones de escritorio, un webhook de Discord que t\u00fa creas, o tu m\u00f3vil mediante Pushover o ntfy. Desconexiones, avisos de memoria, finales de Recycle y una se\u00f1al de \"todo bien\" cada dos horas. Una instalaci\u00f3n nueva no hace ninguna llamada de alertas: nada sale hasta que t\u00fa lo configuras.\n\u2022 Bandeja del sistema con icono coloreado por estado \u2014 el estado de multi-instancia de un vistazo; doble clic lanza tu cuenta principal.\n\u2022 Sistema de plugins. Los plugins opcionales corren como procesos separados y no tienen permisos hasta que se los concedes uno a uno.\n\u2022 Actualizaci\u00f3n autom\u00e1tica v\u00eda Velopack. Una configuraci\u00f3n remota sigue la versi\u00f3n de Roblox y el nombre del mutex conocidos, para que un cambio del lado de Roblox no te deje fuera mucho tiempo.\n\u2022 Accesibilidad medida. Cada control anuncia su nombre a las tecnolog\u00edas de asistencia, y el contraste se verifica sobre p\u00edxeles renderizados en todos los temas.\n\u2022 Habla tu idioma. Toda la app \u2014cada men\u00fa, ajuste, informaci\u00f3n sobre herramientas y ventana, y los mensajes que RoRoRo escribe mientras la usas\u2014 est\u00e1 traducida al franc\u00e9s, alem\u00e1n, ruso, portugu\u00e9s (Brasil), polaco y espa\u00f1ol, seg\u00fan el idioma de tu Windows o tu elecci\u00f3n en Configuraci\u00f3n. El cambio es inmediato, y la lista solo ofrece idiomas totalmente traducidos, as\u00ed que nunca acabas en una pantalla a medias en ingl\u00e9s.\n\nPrivacidad y seguridad:\nRoRoRo nunca ve tu contrase\u00f1a de Roblox. El inicio de sesi\u00f3n ocurre por completo en la p\u00e1gina del propio Roblox, incrustada en un marco Microsoft Edge WebView2: el mismo HTML, la misma conexi\u00f3n HTTPS que har\u00eda tu navegador. RoRoRo captura solo la cookie de sesi\u00f3n que Roblox establece tras iniciar sesi\u00f3n, y la cifra antes de escribirla en disco. Sin telemetr\u00eda. Sin anal\u00edtica. Nada sale de tu m\u00e1quina salvo las llamadas a Roblox durante el lanzamiento \u2014las mismas que hace Roblox.com desde tu navegador\u2014 y, solo si t\u00fa los configuras, las alertas a tu webhook de Discord o al servicio de push que elegiste (Pushover o ntfy).\n\nImportante: aviso de marcas y afiliaci\u00f3n.\n\"Roblox\" y el logotipo de Roblox son marcas de Roblox Corporation. RoRoRo es una herramienta independiente de terceros, no afiliada, avalada ni patrocinada por Roblox Corporation. El t\u00e9rmino se usa \u00fanicamente para describir compatibilidad con la plataforma Roblox. RoRoRo lanza el cliente oficial de Roblox sin modificarlo: sin inyecci\u00f3n, sin hooks, sin alterar el proceso de Roblox; solo retiene un mutex con nombre de Windows antes del lanzamiento, para que las siguientes instancias del cliente vean la comprobaci\u00f3n de singleton como ya ocupada.\n\nUn producto de 626 Labs.", "features": "Launcher multi-instancia para Roblox en Windows, con un clic\nBa\u00fal de cuentas cifrado con DPAPI y exportaci\u00f3n protegida con frase de contrase\u00f1a\nEstado en vivo por cuenta: en qu\u00e9 juego est\u00e1, tiempo inactivo y l\u00edmite de FPS por cuenta\nVigilante de memoria que aprende el costo real de RAM de cada cliente, m\u00e1s Recycle de un clic al mismo servidor\nSquad Launch y Friend Follow: el mismo servidor privado, o un servidor p\u00fablico juntos\nUnirse por enlace desde cualquier URL de roblox.com, con servidores privados guardados por cuenta\nUna ventana de herramientas para Juegos, Ajustes, Historial y m\u00e1s, con atajos de teclado\nCuatro temas integrados m\u00e1s un editor para crear el tuyo\nAlertas opcionales de Discord a un webhook que t\u00fa creas\nBandeja del sistema con icono de estado y doble clic para la cuenta principal\nSistema de plugins con consentimiento por capacidad y aislamiento fuera de proceso\nActualizaci\u00f3n autom\u00e1tica que sigue funcionando cuando Roblox cambia por debajo\nIniciar con Windows si quieres: un solo interruptor, y la lista de Inicio de Windows manda\nDiscord Join arranca RoRoRo aunque est\u00e9 cerrado, y siempre pregunta antes de lanzar nada\nAlertas al m\u00f3vil v\u00eda Pushover o ntfy: un alt se cae y tu m\u00f3vil vibra, aun con Discord cerrado\nSe\u00f1ales de \"todo bien\" cada dos horas mientras tus cuentas corren: el silencio significa problema\nLas alertas se reparten: escritorio, canales de Discord y m\u00f3vil en cualquier combinaci\u00f3n, por alerta\nDisponible en seis idiomas \u2014 toda la app, pantallas y mensajes, en franc\u00e9s, alem\u00e1n, ruso, portugu\u00e9s (Brasil), polaco o espa\u00f1ol, cambio inmediato, seg\u00fan Windows o tu elecci\u00f3n", "whatsnew": "v1.27.0.0\n\nRoRoRo habla tu idioma\n\u2022 Toda la app \u2014 men\u00fas, ajustes, cada ventana y los mensajes\n  que RoRoRo escribe mientras la usas \u2014 est\u00e1 traducida al\n  franc\u00e9s, alem\u00e1n, ruso, portugu\u00e9s (Brasil), polaco y espa\u00f1ol.\n  Si Windows est\u00e1 en uno de ellos, RoRoRo lo adopta solo.\n\nC\u00e1mbialo cuando quieras, al instante\n\u2022 Configuraci\u00f3n > Apariencia solo lista los idiomas a los que\n  RoRoRo est\u00e1 totalmente traducido, as\u00ed nunca acabas en una\n  pantalla a medias. Elige uno y la app cambia al momento, sin\n  reiniciar.\n\nSigue siendo ingl\u00e9s de fondo\n\u2022 El ingl\u00e9s sigue siendo el idioma predeterminado, y los\n  nombres de funciones \u2014 Squad Launch, Recycle, RoRoRo \u2014 se\n  leen igual en todos los idiomas. Tus cuentas, temas y\n  ajustes no cambian.", "captions": "Tres cuentas ejecut\u00e1ndose a la vez, cada una con su propio uso de memoria y su propio bot\u00f3n de parada. Las cookies se cifran por usuario con Windows DPAPI y nunca salen de la m\u00e1quina.\nCuatro temas integrados. Flatline no transmite ning\u00fan significado mediante el color, as\u00ed que no se pierde nada con daltonismo, un panel malo o sol directo.\nMulti-launcher para Windows. Retiene el mutex singleton de Roblox para que el siguiente cliente se abra en vez de pelear con el primero. Una reimplementaci\u00f3n limpia, no un fork.\nGuarda los juegos y servidores privados a los que juegas de verdad y elige uno distinto por cuenta antes de lanzar.\nDiagn\u00f3stico muestra lo que RoRoRo ve ahora mismo: versiones, estado y d\u00f3nde est\u00e1n los registros, para cuando necesites reportar algo.\nCada lanzamiento queda registrado, as\u00ed ves qu\u00e9 cuenta jug\u00f3 a qu\u00e9 y durante cu\u00e1nto tiempo.\nLos plugins se ejecutan como procesos separados y preguntan primero. Concedes cada permiso por su nombre y puedes revocarlo despu\u00e9s.\nCrea un tema con diez colores y aparece en el selector. Es un archivo JSON, as\u00ed que puedes pas\u00e1rselo a otra persona.\nEl modo compacto muestra solo lo que est\u00e1 en marcha. F\u00edjalo en una esquina de la pantalla y vuelve al juego.\nOcho clientes de Roblox, ocho cuentas, un PC. El t\u00edtulo de cada ventana lleva la cuenta que ha iniciado sesi\u00f3n en ella, as\u00ed siempre sabes cu\u00e1l es cu\u00e1l.", "keywords": "roblox\nmulti instancia\nmulticuenta\nlauncher\ngestor de cuentas\ncuentas alt\nmultibox", "copyright_tm": "\u00a9 2026 626 Labs LLC. Todos los derechos reservados. \"Roblox\" es una marca de Roblox Corporation. RoRoRo no est\u00e1 afiliada, avalada ni patrocinada por Roblox Corporation.\n\n\"Roblox\" y el logotipo de Roblox son marcas de Roblox Corporation. RORORO es una herramienta independiente de terceros, no afiliada, avalada ni patrocinada por Roblox Corporation. El t\u00e9rmino se usa \u00fanicamente para describir compatibilidad con la plataforma Roblox. RORORO lanza el cliente oficial de Roblox sin modificaciones.", "license": "RORORO source code is licensed under the MIT License. Full text: https://github.com/estevanhernandez-stack-ed/ROROROblox/blob/main/LICENSE\n\nRORORO is provided \"as is,\" without warranty of any kind. Use of RORORO to access the Roblox platform is governed by Roblox Corporation's own Terms of Use, which you must accept separately when you sign in to a Roblox account. Roblox Corporation has stated that multi-instancing tools \"may be considered malicious behaviour\"; while RORORO does not modify the Roblox client and only holds a Windows named-mutex before launch, the user accepts any risk of Roblox-side enforcement on their accounts.\n\nNo warranty is offered or implied for compatibility with future versions of the Roblox client. The bundled remote-config update mechanism is best-effort.", "developedby": "626 Labs LLC"}}, "folders": {"screenshots": {"path": "docs\\store\\screenshots", "cmd": "explorer docs\\store\\screenshots", "files": ["01-accounts-running.png", "02-themes.png", "03-about.png", "04-games.png", "05-diagnostics.png", "06-history.png", "07-plugins.png", "08-theme-builder.png", "09-compact.png", "10-multi-instance.png"]}}, "slots": {"logos": {"path": "docs\\store\\graphics", "cmd": "explorer docs\\store\\graphics", "rows": [{"label": "9:16 Poster art", "size": "720 x 1080", "file": "store-poster-720x1080.png", "ok": true}, {"label": "9:16 Poster art", "size": "1440 x 2160", "file": "store-poster-1440x2160.png", "ok": true}, {"label": "1:1 Box art", "size": "1080 x 1080", "file": "store-boxart-1080x1080.png", "ok": true}, {"label": "1:1 Box art", "size": "2160 x 2160", "file": "store-boxart-2160x2160.png", "ok": true}]}, "display": {"path": "docs\\store\\graphics", "cmd": "explorer docs\\store\\graphics", "rows": [{"label": "1:1 App tile icon", "size": "300 x 300", "file": "store-display-300x300.png", "ok": true}, {"label": "1:1", "size": "150 x 150", "file": "store-display-150x150.png", "ok": true}, {"label": "1:1", "size": "71 x 71", "file": "store-display-71x71.png", "ok": true}]}, "hero": {"path": "docs\\store\\graphics", "cmd": "explorer docs\\store\\graphics", "rows": [{"label": "16:9 Super hero art", "size": "1920 x 1080", "file": "store-hero-1920x1080.png", "ok": true}, {"label": "16:9 Super hero art", "size": "3840 x 2160", "file": "store-hero-3840x2160.png", "ok": true}]}}, "packages": ["dist\\RORORO-Store-x64-1.27.0.0.msix", "dist\\RORORO-Store-arm64-1.27.0.0.msix"]};
const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

let current = store.get("rororo.listing", 0);
if (typeof current !== "number" || current < 0 || current >= DATA.listings.length) current = 0;
let showEn = store.get("rororo.showen", false);
let done = store.get("rororo.done", {});

$("#ver").textContent = "v" + DATA.version + " \u00b7 Partner Center order";

const pick = $("#pick");
DATA.listings.forEach((l, i) => {
  const o = document.createElement("option");
  o.value = String(i); o.textContent = l.row; pick.appendChild(o);
});
pick.value = String(current);
$("#showen").checked = showEn;

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const was = btn.textContent;
    btn.textContent = "Copied"; btn.classList.add("done");
    setTimeout(() => { btn.textContent = was; btn.classList.remove("done"); }, 1200);
  }).catch(() => { btn.textContent = "Copy failed"; });
}
function countClass(len, cap) {
  if (!cap) return "";
  if (len > cap) return "over";
  if (len > cap * 0.92) return "warn";
  return "ok";
}
function makeBtn(label, text, cls) {
  const b = document.createElement("button");
  b.className = "copy" + (cls ? " " + cls : "");
  b.textContent = label;
  b.addEventListener("click", () => copyText(text, b));
  return b;
}
function head(label, extras) {
  const h = document.createElement("div");
  h.className = "fhead";
  const t = document.createElement("h2");
  t.textContent = label; h.appendChild(t);
  (extras || []).forEach((e) => h.appendChild(e));
  return h;
}
function noteEl(text, warn) {
  const n = document.createElement("span");
  n.className = "fnote" + (warn ? " warn" : "");
  n.textContent = text;
  return n;
}

function render() {
  const listing = DATA.listings[current];
  const lang = listing.lang;
  const copy = DATA.copy[lang];
  const en = DATA.copy.en;

  const banner = $("#banner");
  banner.innerHTML = "";
  const strong = document.createElement("strong");
  strong.textContent = listing.row; banner.appendChild(strong);
  const meta = document.createElement("span");
  meta.className = "note";
  meta.textContent = DATA.langName[lang] + (listing.note ? " \u00b7 " + listing.note : "");
  banner.appendChild(meta);
  const mark = document.createElement("button");
  mark.className = "copy ghost";
  mark.textContent = done[listing.row] ? "Done \u2713" : "Mark done";
  mark.addEventListener("click", () => { done[listing.row] = !done[listing.row]; store.set("rororo.done", done); render(); });
  banner.appendChild(mark);

  const prog = $("#prog");
  prog.innerHTML = "";
  DATA.listings.forEach((l, i) => {
    const c = document.createElement("button");
    c.className = "chip" + (done[l.row] ? " done" : "");
    if (i === current) c.setAttribute("aria-current", "true");
    c.textContent = l.row;
    c.addEventListener("click", () => { current = i; store.set("rororo.listing", i); pick.value = String(i); render(); });
    prog.appendChild(c);
  });

  const host = $("#fields");
  host.innerHTML = "";

  DATA.blocks.forEach((b) => {
    if (b.kind === "section") {
      const h3 = document.createElement("h3");
      h3.className = "rule"; h3.textContent = b.label; host.appendChild(h3);
      return;
    }
    const sec = document.createElement("section");
    sec.className = "field" + (b.kind === "skip" ? " skip" : "");

    if (b.kind === "skip") {
      sec.appendChild(head(b.label, []));
      if (b.note) { const p = document.createElement("p"); p.className = "hint"; p.textContent = b.note; sec.appendChild(p); }
      host.appendChild(sec); return;
    }

    if (b.kind === "folder") {
      const f = DATA.folders[b.key];
      sec.appendChild(head(b.label, [
        Object.assign(document.createElement("span"), { className: "count", textContent: f.files.length + " files" }),
        makeBtn("Copy command", f.cmd)
      ]));
      const row = document.createElement("div"); row.className = "pathrow";
      const c = document.createElement("code"); c.className = "path"; c.textContent = f.cmd; row.appendChild(c);
      row.appendChild(makeBtn("Copy path", f.path, "ghost"));
      sec.appendChild(row);
      // Each row pairs the file being uploaded with the caption that goes under it, in upload
      // order, so the two never drift apart while working down the form.
      const caps = (copy.captions || "").split("\n").filter((x) => x.trim());
      const enCaps = (en.captions || "").split("\n").filter((x) => x.trim());
      const ol = document.createElement("ol"); ol.className = "items";
      f.files.forEach((n, i) => {
        const cap = caps[i] || "";
        const li = document.createElement("li");
        const num = document.createElement("span"); num.className = "fnum";
        num.textContent = String(i + 1).padStart(2, "0"); li.appendChild(num);
        const tx = document.createElement("div"); tx.className = "ftext";
        const fn = document.createElement("span"); fn.className = "shotfile"; fn.textContent = n; tx.appendChild(fn);
        const cp = document.createElement("span"); cp.textContent = cap || "(no caption)"; tx.appendChild(cp);
        if (showEn && lang !== "en" && enCaps[i] && enCaps[i] !== cap) {
          const s2 = document.createElement("span"); s2.className = "fen"; s2.textContent = enCaps[i]; tx.appendChild(s2);
        }
        li.appendChild(tx);
        const cc = document.createElement("span");
        cc.className = "count " + countClass(cap.length, b.cap); cc.textContent = cap.length; li.appendChild(cc);
        li.appendChild(makeBtn("Copy", cap));
        ol.appendChild(li);
      });
      sec.appendChild(ol);
      const p = document.createElement("p"); p.className = "hint";
      p.textContent = (b.note ? b.note + " " : "") + "A browser can't open a local folder - paste the command in a terminal at the repo root.";
      sec.appendChild(p);
      host.appendChild(sec); return;
    }

    if (b.kind === "slots") {
      const s = DATA.slots[b.key];
      sec.appendChild(head(b.label, [makeBtn("Copy command", s.cmd, "ghost")]));
      const tbl = document.createElement("table"); tbl.className = "slots";
      s.rows.forEach((r) => {
        const tr = document.createElement("tr");
        const a = document.createElement("td"); a.textContent = r.label; tr.appendChild(a);
        const sz = document.createElement("td"); sz.className = "slotsize"; sz.textContent = r.size; tr.appendChild(sz);
        const fl = document.createElement("td"); fl.className = "slotfile" + (r.ok ? "" : " missing");
        fl.textContent = r.ok ? r.file : r.file + " (MISSING)"; tr.appendChild(fl);
        tbl.appendChild(tr);
      });
      sec.appendChild(tbl);
      if (b.note) { const p = document.createElement("p"); p.className = "hint"; p.textContent = b.note; sec.appendChild(p); }
      host.appendChild(sec); return;
    }

    const val = copy[b.key] || "";
    const enVal = en[b.key] || "";

    if (b.kind === "list") {
      const entries = val.split("\n").filter((x) => x.trim());
      const enEntries = enVal.split("\n").filter((x) => x.trim());
      sec.appendChild(head(b.label, [
        Object.assign(document.createElement("span"), { className: "count", textContent: entries.length + (b.key === "keywords" ? " / 7" : " / 20") }),
        makeBtn("Copy all", val)
      ]));
      if (b.note) sec.lastChild.appendChild(noteEl(b.note));
      const ol = document.createElement("ol"); ol.className = "items";
      entries.forEach((e, i) => {
        const li = document.createElement("li");
        const num = document.createElement("span"); num.className = "fnum"; num.textContent = String(i + 1).padStart(2, "0"); li.appendChild(num);
        const tx = document.createElement("div"); tx.className = "ftext"; tx.textContent = e;
        if (showEn && lang !== "en" && enEntries[i] && enEntries[i] !== e) {
          const s2 = document.createElement("span"); s2.className = "fen"; s2.textContent = enEntries[i]; tx.appendChild(s2);
        }
        li.appendChild(tx);
        const cc = document.createElement("span"); cc.className = "count " + countClass(e.length, b.cap); cc.textContent = e.length; li.appendChild(cc);
        li.appendChild(makeBtn("Copy", e));
        ol.appendChild(li);
      });
      sec.appendChild(ol);
      host.appendChild(sec); return;
    }

    // text
    const extras = [
      Object.assign(document.createElement("span"), {
        className: "count " + countClass(val.length, b.cap),
        textContent: b.cap ? val.length + " / " + b.cap : val.length + " chars"
      }),
      makeBtn("Copy", val)
    ];
    const h = head(b.label, extras);
    if (b.note) h.appendChild(noteEl(b.note));
    if (b.key === "productname" && DATA.nameNotes[lang]) h.appendChild(noteEl(DATA.nameNotes[lang], true));
    sec.appendChild(h);
    const pre = document.createElement("pre"); pre.className = "text"; pre.textContent = val; sec.appendChild(pre);
    if (showEn && lang !== "en" && enVal && enVal !== val) {
      const w = document.createElement("div"); w.className = "english";
      const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = "English reference"; w.appendChild(tag);
      const p2 = document.createElement("pre"); p2.className = "text"; p2.textContent = enVal; w.appendChild(p2);
      sec.appendChild(w);
    }
    host.appendChild(sec);
  });
}

const pkgSec = document.createElement("section");
pkgSec.className = "field";
DATA.packages.forEach((p) => {
  const row = document.createElement("div"); row.className = "pathrow";
  const c = document.createElement("code"); c.className = "path"; c.textContent = p; row.appendChild(c);
  row.appendChild(makeBtn("Copy", p));
  pkgSec.appendChild(row);
});
const pkgHint = document.createElement("p");
pkgHint.className = "hint";
pkgHint.textContent = "Both go in the Packages slot. Unsigned by design \u2014 Partner Center signs after upload.";
pkgSec.appendChild(pkgHint);
$("#packages").appendChild(pkgSec);

pick.addEventListener("change", () => { current = Number(pick.value); store.set("rororo.listing", current); render(); });
$("#showen").addEventListener("change", (e) => { showEn = e.target.checked; store.set("rororo.showen", showEn); render(); });
render();
</script>
